# Project metadata
name: orphan
description: "A Flutter project for managing orphan profiles and sponsorships."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  translator: ^1.0.0 # أو أحدث إصدار

  flutter_localizations:
    sdk: flutter

  # Window & Desktop Management
  window_manager: ^0.3.7
  http: ^1.1.0
  # Modern UI Libraries
  flutter_animate: ^4.2.0
  animate_do: ^3.1.2
  lottie: ^3.1.2
  shimmer: ^3.0.0
  badges: ^3.1.2
  smooth_page_indicator: ^1.1.0
  glassmorphism: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.1.1

  # State Management & Navigation
  provider: ^6.1.5+1
  get_it: ^8.0.3
  go_router: ^13.2.5

  # File & Storage
  path_provider: ^2.1.1
  file_picker: ^10.3.6
  uuid: ^4.2.0

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.12.0
  open_file: ^3.2.1

  # Localization & Fonts
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # Image Processing
  image: ^4.0.17
  image_cropper: ^11.0.0
  google_mlkit_face_detection: ^0.8.0

  # Database dependencies
  sqflite_common_ffi: ^2.3.0
  sqflite: ^2.3.0
  path: ^1.9.0
  arabic_reshaper: ^0.0.1
  shared_preferences: ^2.5.4

  # Firebase dependencies
  firebase_core: ^3.10.1
  cloud_firestore: ^5.0.1
  # تم استبدال firebase_storage بـ GitHub Storage (مجاني تماماً)

  archive: ^3.4.10
  sqflite_common_ffi_web: ^1.1.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.12
  intl_utils: ^2.8.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png" # مسار الأيقونة
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter_gen:
  outputs:
    class_name: "GeneratedAssets"
    package: "flutter_gen"
  integrations:
    flutter_localizations:
      enabled: true

flutter:
  uses-material-design: true

  generate: true

  # Assets
  # Register app assets. Add the referenced files under the `assets/` folder.
  assets:
    - assets/logo.png
    - assets/fonts/
    - assets/images/
    - assets/countries.json
    - assets/cities.json
    - assets/icon/
    - lib/l10n/app_ar.arb
    - lib/l10n/app_en.arb
    - lib/l10n/app_tr.arb
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
        - asset: assets/fonts/Cairo-ExtraBold.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  # MSIX configuration - at the TOP LEVEL, not inside dependencies
# MSIX configuration - at the TOP LEVEL, not inside dependencies
msix_config:
  display_name: Orphan Management
  publisher_display_name: Mohamed Atef Toman
  identity_name: com.test.orphanmanagement
  msix_version: 1.0.0.0
  publisher: CN=Mohamed Atef Toman
  logo_path: assets/logo.png
  capabilities: "internetClient,location"

