<svg width="200" height="200"
    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Background -->
    <rect width="200" height="200" fill="#F3E5F5"/>

    <!-- Head -->
    <circle cx="100" cy="70" r="35" fill="#FDBCB4"/>

    <!-- Hair -->
    <path d="M 65 50 Q 65 20 100 15 Q 135 20 135 50 Z" fill="#8B4513"/>
    <circle cx="70" cy="30" r="10" fill="#8B4513"/>
    <circle cx="130" cy="30" r="10" fill="#8B4513"/>
    <path d="M 60 55 Q 70 45 80 55" fill="#8B4513"/>
    <path d="M 120 55 Q 130 45 140 55" fill="#8B4513"/>

    <!-- Eyes -->
    <circle cx="90" cy="65" r="4" fill="#000"/>
    <circle cx="110" cy="65" r="4" fill="#000"/>
    <circle cx="91" cy="64" r="1.5" fill="#FFF"/>
    <circle cx="111" cy="64" r="1.5" fill="#FFF"/>

    <!-- Eyelashes -->
    <path d="M 88 61 L 87 57 M 90 60 L 90 56 M 92 61 L 93 57" stroke="#000" stroke-width="1" stroke-linecap="round"/>
    <path d="M 108 61 L 107 57 M 110 60 L 110 56 M 112 61 L 113 57" stroke="#000" stroke-width="1" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 100 70 L 100 80" stroke="#A1887F" stroke-width="1.5" fill="none"/>

    <!-- Smile -->
    <path d="M 88 85 Q 100 93 112 85" stroke="#A1887F" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M 85 58 Q 90 55 95 58" stroke="#8B4513" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 105 58 Q 110 55 115 58" stroke="#8B4513" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Dress -->
    <path d="M 70 100 L 55 160 L 145 160 L 130 100 Z" fill="#FF69B4"/>

    <!-- Arms -->
    <rect x="50" y="110" width="15" height="50" rx="7" fill="#FDBCB4"/>
    <rect x="135" y="110" width="15" height="50" rx="7" fill="#FDBCB4"/>

    <!-- Hands -->
    <circle cx="57.5" cy="165" r="8" fill="#FDBCB4"/>
    <circle cx="142.5" cy="165" r="8" fill="#FDBCB4"/>

    <!-- Shoes -->
    <ellipse cx="75" cy="160" rx="10" ry="6" fill="#333"/>
    <ellipse cx="125" cy="160" rx="10" ry="6" fill="#333"/>

    <!-- Bow in hair -->
    <ellipse cx="85" cy="25" rx="8" ry="6" fill="#FF1493"/>
    <ellipse cx="115" cy="25" rx="8" ry="6" fill="#FF1493"/>
    <circle cx="100" cy="25" r="5" fill="#FF1493"/>
</svg>
