<svg width="200" height="200"
    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Background -->
    <rect width="200" height="200" fill="#E3F2FD"/>

    <!-- Head -->
    <circle cx="100" cy="70" r="35" fill="#FDBCB4"/>

    <!-- Hair -->
    <path d="M 65 50 Q 65 25 100 20 Q 135 25 135 50 Z" fill="#6D4C41"/>
    <circle cx="75" cy="35" r="8" fill="#6D4C41"/>
    <circle cx="125" cy="35" r="8" fill="#6D4C41"/>

    <!-- Eyes -->
    <circle cx="90" cy="65" r="4" fill="#000"/>
    <circle cx="110" cy="65" r="4" fill="#000"/>
    <circle cx="91" cy="64" r="1.5" fill="#FFF"/>
    <circle cx="111" cy="64" r="1.5" fill="#FFF"/>

    <!-- Nose -->
    <path d="M 100 70 L 100 80" stroke="#8D6E63" stroke-width="1.5" fill="none"/>

    <!-- Smile -->
    <path d="M 90 85 Q 100 92 110 85" stroke="#8D6E63" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M 85 58 Q 90 55 95 58" stroke="#6D4C41" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 105 58 Q 110 55 115 58" stroke="#6D4C41" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Shirt/Body -->
    <path d="M 70 100 L 60 160 L 140 160 L 130 100 Z" fill="#4DB8FF"/>

    <!-- Arms -->
    <rect x="50" y="110" width="15" height="60" rx="7" fill="#FDBCB4"/>
    <rect x="135" y="110" width="15" height="60" rx="7" fill="#FDBCB4"/>

    <!-- Hands -->
    <circle cx="57.5" cy="175" r="8" fill="#FDBCB4"/>
    <circle cx="142.5" cy="175" r="8" fill="#FDBCB4"/>

    <!-- Pants -->
    <rect x="80" y="155" width="12" height="45" fill="#1F3A93"/>
    <rect x="108" y="155" width="12" height="45" fill="#1F3A93"/>

    <!-- Shoes -->
    <ellipse cx="86" cy="200" rx="8" ry="6" fill="#333"/>
    <ellipse cx="114" cy="200" rx="8" ry="6" fill="#333"/>
</svg>
